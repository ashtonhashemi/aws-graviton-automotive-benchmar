  P2LegacyEcu3PrivateIp:
    Value: !GetAtt P2LegacyEcu3Worker.PrivateIp
  P2LegacyEcu4InstanceId:
    Value: !Ref P2LegacyEcu4Worker
  P2LegacyEcu4PrivateIp:
    Value: !GetAtt P2LegacyEcu4Worker.PrivateIp
  P2HpcInstanceId:
    Value: !Ref P2HpcWorker
  P2HpcPrivateIp:
    Value: !GetAtt P2HpcWorker.PrivateIp
  P2Zcu1InstanceId:
