AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS automotive systems lab with distributed ESC SIL and measured legacy-vs-zonal OBDonUDS architecture benchmarking

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Single-AZ subnet with outbound internet access so SSM and S3 are reachable.
  AdminToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Lab-only token required by the dashboard API. Do not commit this value.
  X86InstanceType:
    Type: String
    Default: c7i.large
  ArmInstanceType:
    Type: String
    Default: c8g.large
  P2X86InstanceType:
    Type: String
    Default: c7i.large
    Description: Fixed-performance x86 type for tester, legacy gateway, legacy ECUs, and ZCU simulation nodes.
  P2HpcInstanceType:
    Type: String
    Default: c8g.large
    Description: AWS Graviton instance used as the zonal vehicle HPC.
  X86Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  ArmAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256

Resources:
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBenchmarkResults
            Status: Enabled
            ExpirationInDays: 30
            Prefix: results/

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Automotive lab workers; no public inbound access
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Outbound access for SSM, S3, and private VPC communication

  EscUdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      IpProtocol: udp
      FromPort: 5005
      ToPort: 5005
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
      Description: Real 100 Hz ESC sensor and command traffic between HPC and ZCU

  P2TcpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      IpProtocol: tcp
      FromPort: 13400
      ToPort: 13400
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
      Description: Private DoIP diagnostic-message traffic for measured architecture benchmarking

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: BenchmarkAssetsAndResults
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${ResultsBucket.Arn}/*'

  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]

  X86Worker:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref X86Ami
      InstanceType: !Ref X86InstanceType
      IamInstanceProfile: !Ref WorkerInstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref WorkerSecurityGroup]
      InstanceInitiatedShutdownBehavior: stop
      Tags:
        - Key: Name
          Value: esc-zcu-x86
        - Key: Role
          Value: ZCU-ESC
        - Key: Project
          Value: aws-graviton-automotive-benchmark
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y jq
          systemctl enable --now amazon-ssm-agent || true
          shutdown -h now

  ArmWorker:
