  P2LegacyEcu1PrivateIp:
    Value: !GetAtt P2LegacyEcu1Worker.PrivateIp
  P2LegacyEcu2InstanceId:
    Value: !Ref P2LegacyEcu2Worker
  P2LegacyEcu2PrivateIp:
    Value: !GetAtt P2LegacyEcu2Worker.PrivateIp
  P2LegacyEcu3InstanceId:
