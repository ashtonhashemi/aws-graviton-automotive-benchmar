  ControlApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type', 'x-admin-token']
        AllowMethods: ['GET', 'POST', 'OPTIONS']

  ControlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/control/
      Handler: app.handler
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref ResultsBucket
          RESULTS_TABLE: !Ref ResultsTable
          X86_INSTANCE_ID: !Ref X86Worker
          ARM_INSTANCE_ID: !Ref ArmWorker
          P2_TESTER_INSTANCE_ID: !Ref P2TesterWorker
          P2_LEGACY_GATEWAY_INSTANCE_ID: !Ref P2LegacyGatewayWorker
          P2_LEGACY_ECU1_INSTANCE_ID: !Ref P2LegacyEcu1Worker
          P2_LEGACY_ECU2_INSTANCE_ID: !Ref P2LegacyEcu2Worker
          P2_LEGACY_ECU3_INSTANCE_ID: !Ref P2LegacyEcu3Worker
          P2_LEGACY_ECU4_INSTANCE_ID: !Ref P2LegacyEcu4Worker
          P2_HPC_INSTANCE_ID: !Ref P2HpcWorker
          P2_ZCU1_INSTANCE_ID: !Ref P2Zcu1Worker
          P2_ZCU2_INSTANCE_ID: !Ref P2Zcu2Worker
          P2_ZCU3_INSTANCE_ID: !Ref P2Zcu3Worker
          P2_ZCU4_INSTANCE_ID: !Ref P2Zcu4Worker
          ADMIN_TOKEN: !Ref AdminToken
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:StartInstances
                - ec2:StopInstances
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:SendCommand
                - ssm:GetCommandInvocation
                - ssm:DescribeInstanceInformation
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !GetAtt ResultsBucket.Arn
                - !Sub '${ResultsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt ResultsTable.Arn
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /status
            Method: GET
        InstanceAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /instances/{arch}/{action}
            Method: POST
        RunBenchmark:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /benchmark/run
            Method: POST
        GetBenchmark:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /benchmark/results/{run_id}
            Method: GET
        P2TimingStudy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /p2/simulate
            Method: POST
        P2MeasuredStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /p2/measured/status
            Method: GET
        P2MeasuredFleetAction:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /p2/measured/nodes/{action}
            Method: POST
        P2MeasuredRun:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /p2/measured/run
            Method: POST
        P2MeasuredResults:
          Type: HttpApi
          Properties:
            ApiId: !Ref ControlApi
            Path: /p2/measured/results/{run_id}
            Method: GET

  DashboardBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  DashboardOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-dashboard-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DashboardDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: dashboard-s3
            DomainName: !GetAtt DashboardBucket.RegionalDomainName
            OriginAccessControlId: !Ref DashboardOriginAccessControl
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: dashboard-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  DashboardBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DashboardBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${DashboardBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DashboardDistribution}'

Outputs:
  ApiUrl:
    Value: !Sub 'https://${ControlApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  DashboardUrl:
    Value: !Sub 'https://${DashboardDistribution.DomainName}'
  DashboardBucket:
    Value: !Ref DashboardBucket
  DashboardDistributionId:
    Value: !Ref DashboardDistribution
  ResultsBucket:
    Value: !Ref ResultsBucket
  ResultsTable:
    Value: !Ref ResultsTable
  X86InstanceId:
    Value: !Ref X86Worker
  X86ZcuPrivateIp:
    Value: !GetAtt X86Worker.PrivateIp
  ArmInstanceId:
    Value: !Ref ArmWorker
  GravitonHpcPrivateIp:
    Value: !GetAtt ArmWorker.PrivateIp

  P2TesterInstanceId:
    Value: !Ref P2TesterWorker
  P2TesterPrivateIp:
    Value: !GetAtt P2TesterWorker.PrivateIp
  P2LegacyGatewayInstanceId:
    Value: !Ref P2LegacyGatewayWorker
  P2LegacyGatewayPrivateIp:
    Value: !GetAtt P2LegacyGatewayWorker.PrivateIp
  P2LegacyEcu1InstanceId:
